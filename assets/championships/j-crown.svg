<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">J-Crown championship emblem</title>
  <desc id="desc">A gold eight-point crown emblem representing the eight junior heavyweight championships unified as the J-Crown.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a3"/><stop offset=".38" stop-color="#e0ae31"/><stop offset=".72" stop-color="#8f5a08"/><stop offset="1" stop-color="#ffd96b"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1200" height="700" rx="50" fill="#101216"/>
  <g filter="url(#shadow)" fill="url(#gold)" stroke="#ffe798" stroke-width="8">
    <path d="M180 430 120 190l155 105 80-190 125 160 120-205 120 205 125-160 80 190 155-105-60 240z"/>
    <rect x="180" y="430" width="840" height="120" rx="35"/>
  </g>
  <text x="600" y="420" text-anchor="middle" fill="#101216" font-family="Impact,Arial Black,sans-serif" font-size="178" letter-spacing="12">J-CROWN</text>
  <text x="600" y="515" text-anchor="middle" fill="#101216" font-family="Arial,sans-serif" font-weight="800" font-size="42" letter-spacing="8">EIGHT CHAMPIONSHIPS</text>
  <g fill="#e2b13b">
    <circle cx="180" cy="610" r="15"/><circle cx="300" cy="610" r="15"/><circle cx="420" cy="610" r="15"/><circle cx="540" cy="610" r="15"/>
    <circle cx="660" cy="610" r="15"/><circle cx="780" cy="610" r="15"/><circle cx="900" cy="610" r="15"/><circle cx="1020" cy="610" r="15"/>
  </g>
</svg>
